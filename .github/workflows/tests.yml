name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/test/paper_experiments/out/
            !/test/paper_experiments/out/**

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install PyTorch 1.12.1 (CPU)
        run: |
          pip install --no-cache-dir torch==1.12.1+cpu torchvision==0.13.1+cpu \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install remaining dependencies
        run: |
          grep -v "^torch==" requirements.txt | grep -v "^POT" | grep -v "^tick" | grep -v "^signatory" | pip install --no-cache-dir -r /dev/stdin "torchmetrics<1.0.0"
          # requirements.txt pins POT==0.8.2 (the version used for the paper experiments).
          # CI installs 0.9.0 instead because it provides prebuilt wheels for this
          # Python 3.8 / CPU runner. Only ot.emd2 (exact EMD) is used, whose API and
          # numerical result are identical across 0.8.2 and 0.9.0.
          pip install --no-cache-dir "POT==0.9.0" pytest

      - name: Run tests
        run: |
          python -m pytest tests_src/ \
            -v --tb=long \
            --junit-xml=test-results.xml
        env:
          PYTHONPATH: src:.

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
