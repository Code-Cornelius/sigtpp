version: gamma
seeds: [ 42 ]
gpu_id: [ 0 ]
epochs: 100
patience: 100
period_log: 1
period_plotting_in_logs: 20
verbose: True
server_training: False
# diagnostic_only: True  → skip training, load existing checkpoint and run eval only (re-evaluate a trained model)
diagnostic_only: False
# skip_diagnostics: True → run training, then skip the eval/test phase (useful for CI / quick smoke tests)
skip_diagnostics: False
n_bootstraps: 5
refine_best_n_bootstraps: 10

# Disk cleanup: keeps only the top-K models/<name>/ dirs by val_norm_score
# (default 10). Set <= 0 to keep all (needed for recompute_bootstrap.py).
# keep_top_k_models: 10

output_dir: "test/paper_experiments"

parameter_sets:
  learning_rate: [ 1.0e-1 ]
